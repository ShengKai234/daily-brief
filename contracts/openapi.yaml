openapi: 3.1.0
info:
  title: Daily Brief API
  version: 0.1.0
  summary: Contract shared by the web app, the future iOS app, and the agent worker.
  description: |
    Single contract for the Daily Brief backend. Client types are generated from this file.

    Full URLs are `/api/v1/...` (public), `/api/health`, and `/api/internal/...` (worker only).

    **Authentication** (DESIGN 3.4, `docs/auth-passkey-design.md`). Users sign in with passkeys
    (WebAuthn). Every `/v1` route requires the session cookie (`sessionCookie`), except the four
    public sign-in operations under `/v1/auth/registration/*` and `/v1/auth/login/*`. A session is
    valid only if it is unrevoked, within its idle and absolute lifetime and `profiles.status` is
    `active`; a `kind='passkey'` session also needs its passkey to be active and owned by the same user,
    and a `kind='dev'` session is accepted only when `APP_ENV=local`. Otherwise 401 `unauthorized`. Every `/internal` route requires the
    service token in `X-Internal-Token` (`internalToken`). `/v1` rejects the internal token and any
    `Authorization: Bearer` header (401 `unauthorized`), on public sign-in operations too; `/internal`
    rejects session cookies. `/health` is unauthenticated.

    **Request rules for `/v1`.** Every unsafe method (POST, PUT, PATCH, DELETE), including the public
    sign-in operations and logout, needs exactly one `Origin` header equal to a configured origin,
    otherwise 403 `origin_mismatch`. Operations with a body need `Content-Type: application/json`
    (415 `unsupported_media_type`); bodyless operations accept an empty body. Public sign-in bodies
    are limited to 64 KB (413 `payload_too_large`). Check order: route family, body size, Origin,
    media type, rate limit, authentication, reauthentication, validation, state conflict. All `/api`
    responses carry `Cache-Control: no-store`. `/internal` does not check `Origin`.

    **Registration gate.** A profile is created only by `registerVerify` with an invite token, or by
    the admin CLI for the owner. Signing in never creates a profile. `status` is `active` or
    `disabled`. A disabled account's sessions are revoked, so session-authenticated routes return 401;
    the public sign-in and registration operations return 403 `account_disabled`, at login only after a
    valid passkey proof.

    **Errors.** All errors are RFC 9457 `application/problem+json` (`Problem`) with a
    machine-readable `code`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api
    description: Same origin as the frontend; routed to the API.
tags:
  - name: health
    description: Liveness.
  - name: profile
    description: The caller's profile.
  - name: auth
    description: Passkey sign-in, sessions and passkey management.
  - name: topics
    description: Free-text topics.
  - name: subscriptions
    description: Topic subscriptions, item counts and order.
  - name: delivery-slots
    description: Up to 3 daily delivery times.
  - name: reports
    description: Generated reports and items.
  - name: marks
    description: Read state and notes on items.
  - name: jobs
    description: On-demand brief generation ("Generate now") and its status.
  - name: agent-settings
    description: Agent settings (reserved in the POC).
  - name: internal
    description: Worker-only endpoints. Reject user JWTs.
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns only status ok, no data. No authentication.
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me:
    get:
      operationId: getMe
      summary: Read the caller's profile
      description: Returns 401 when not signed in; the web app shows the sign-in page then.
      tags: [profile]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateMe
      summary: Update the caller's profile
      description: Requires an `active` account.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/registration/options:
    post:
      operationId: registerOptions
      summary: Start registering a passkey with an enrollment token
      description: |
        Public. The token comes from the enrollment link's URL fragment. Validates the token without
        using it, increments its lifetime `options_count` (limit 10, committed even on failure), creates a
        ceremony bound to this browser (sets or refreshes the browser-binding cookie) and returns
        WebAuthn creation options. `display_name` is accepted only for invite tokens. Invite tokens and
        tokens for a non-owner are refused with 403 `admission_disabled` while non-owner admission is off.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationOptionsRequest" }
      responses:
        "200":
          description: Creation options.
          headers:
            Set-Cookie: { $ref: "#/components/headers/BindingCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CeremonyOptions" }
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "409": { $ref: "#/components/responses/TokenConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/registration/verify:
    post:
      operationId: registerVerify
      summary: Finish registering a passkey
      description: |
        Public. Verifies the attestation (user verification required) and, in one transaction, creates the
        profile (invite), replaces all old passkeys and sessions (recovery) or adds a passkey
        (add_credential), uses the token and starts a new session. A valid but failed proof consumes the
        ceremony; a request from another browser consumes nothing.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationVerifyRequest" }
      responses:
        "200":
          description: Signed in; the profile.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "409": { $ref: "#/components/responses/TokenConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/login/options:
    post:
      operationId: loginOptions
      summary: Start signing in with a passkey
      description: Public. Returns request options with an empty `allowCredentials` (discoverable passkeys).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "200":
          description: Request options.
          headers:
            Set-Cookie: { $ref: "#/components/headers/BindingCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CeremonyOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/login/verify:
    post:
      operationId: loginVerify
      summary: Finish signing in with a passkey
      description: |
        Public. Any failed proof returns the same 401 `authentication_failed` body (unknown, revoked or
        mismatched credential, bad signature, missing user verification, counter regression on a
        device-bound passkey). 403 `account_disabled` only after a valid proof.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CeremonyVerifyRequest" }
      responses:
        "200":
          description: Signed in; the profile.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out this browser
      description: No body. Revokes the current session and clears the cookie (same name and attributes, `Max-Age=0`).
      tags: [auth]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
  /v1/auth/reauth/options:
    post:
      operationId: reauthOptions
      summary: Start a reauthentication
      description: No body. `allowCredentials` lists the caller's active passkeys. The ceremony is bound to this session.
      tags: [auth]
      responses:
        "200":
          description: Request options.
          headers:
            Set-Cookie: { $ref: "#/components/headers/BindingCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CeremonyOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/reauth/verify:
    post:
      operationId: reauthVerify
      summary: Finish a reauthentication
      description: The passkey must belong to the session's user. On success sensitive actions are allowed for 5 minutes.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CeremonyVerifyRequest" }
      responses:
        "204": { description: Reauthenticated. }
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/me/passkeys:
    get:
      operationId: listPasskeys
      summary: List the caller's active passkeys
      tags: [auth]
      responses:
        "200":
          description: Passkeys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/passkeys/options:
    post:
      operationId: addPasskeyOptions
      summary: Start adding a passkey on this device
      description: No body. Needs a reauthentication within 5 minutes. `excludeCredentials` lists the caller's active passkeys.
      tags: [auth]
      responses:
        "200":
          description: Creation options.
          headers:
            Set-Cookie: { $ref: "#/components/headers/BindingCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CeremonyOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/PasskeyConflict" }
  /v1/me/passkeys/verify:
    post:
      operationId: addPasskeyVerify
      summary: Finish adding a passkey
      description: The reauthentication must still be within 5 minutes. At most 10 active passkeys per user.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationVerifyRequest" }
      responses:
        "201":
          description: The new passkey.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/PasskeyConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/me/passkeys/{passkey_id}:
    delete:
      operationId: deletePasskey
      summary: Revoke one of the caller's passkeys
      description: |
        Needs a reauthentication within 5 minutes. Refused for the last active passkey (409 `last_passkey`).
        Revokes every session created with it; if that includes the current session, the response also
        clears the cookie. Another user's id is 404.
      tags: [auth]
      parameters:
        - name: passkey_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PasskeyConflict" }
  /v1/me/sessions:
    get:
      operationId: listSessions
      summary: List the caller's signed-in sessions
      tags: [auth]
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/sessions/{session_id}:
    delete:
      operationId: deleteSession
      summary: Revoke one of the caller's sessions
      description: Revoking the current session is the same as logout. Another user's id is 404.
      tags: [auth]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/topics:
    get:
      operationId: listTopics
      summary: List the caller's topics
      tags: [topics]
      responses:
        "200":
          description: Topics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [topics]
                properties:
                  topics:
                    type: array
                    items: { $ref: "#/components/schemas/Topic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createTopic
      summary: Create a topic
      tags: [topics]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicCreate" }
      responses:
        "201":
          description: Created topic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/topics/{topic_id}:
    parameters:
      - $ref: "#/components/parameters/TopicId"
    patch:
      operationId: updateTopic
      summary: Update a topic
      tags: [topics]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicUpdate" }
      responses:
        "200":
          description: Updated topic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: deleteTopic
      summary: Delete a topic
      description: Also removes subscriptions to it.
      tags: [topics]
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions ordered by position
      tags: [subscriptions]
      responses:
        "200":
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createSubscription
      summary: Subscribe to an existing topic or a new topic title
      description: Send either `topic_id` or `title` (creates a private topic). Duplicate returns 409 `already_subscribed`.
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionCreate" }
      responses:
        "201":
          description: Created subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/subscriptions/{subscription_id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    patch:
      operationId: updateSubscription
      summary: Update item count, order or enabled flag
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionUpdate" }
      responses:
        "200":
          description: Updated subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: deleteSubscription
      summary: Delete a subscription
      tags: [subscriptions]
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/delivery-slots:
    get:
      operationId: getDeliverySlots
      summary: Get the caller's delivery slots
      tags: [delivery-slots]
      responses:
        "200":
          description: Slots and the timezone they are interpreted in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySlotSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      operationId: replaceDeliverySlots
      summary: Replace the full set of delivery slots
      description: |
        Replaces all slots. More than 3 returns 422 `slot_limit_exceeded`; duplicate
        `local_time` values return 422 (`duplicate_slot`). Positions are assigned by array order.
      tags: [delivery-slots]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverySlotsReplace" }
      responses:
        "200":
          description: The stored slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySlotSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/reports:
    get:
      operationId: listReports
      summary: List the caller's reports for a date
      tags: [reports]
      parameters:
        - name: date
          in: query
          required: false
          description: Report date. Defaults to today in the caller's timezone.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Report summaries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reports]
                properties:
                  reports:
                    type: array
                    items: { $ref: "#/components/schemas/ReportSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/reports/{report_id}:
    get:
      operationId: getReport
      summary: Get one report with sections, items and the caller's marks
      description: Only the caller's own reports; others return 404.
      tags: [reports]
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/items/{item_id}/mark:
    put:
      operationId: setItemMark
      summary: Set read state and note on an item
      description: Notes are plain text and must always be rendered as plain text.
      tags: [marks]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemMarkUpdate" }
      responses:
        "200":
          description: The mark.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemMark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/agent-settings:
    get:
      operationId: getAgentSettings
      summary: Get agent settings (display only in the POC)
      tags: [agent-settings]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateAgentSettings
      summary: Update agent settings (reserved in the POC)
      description: |
        Defined for forward compatibility. In the POC every field is reserved: the API rejects
        any change with 403 code `agent_settings_locked`.
      tags: [agent-settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSettingsUpdate" }
      responses:
        "200":
          description: Updated settings (not reachable in the POC).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Code `agent_settings_locked` (every change in the POC) or `origin_mismatch`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/jobs:
    post:
      operationId: generateNow
      summary: Queue a brief for the caller now ("Generate now")
      description: |
        Creates one on-demand job for the caller (`slot_id` null, `scheduled_for` = now) with the runner
        from the caller's agent settings, commits it, then dispatches the worker. No request body.
        - Counts toward `daily_run_limit`, together with scheduled jobs, in the same day window the
          scheduler uses (the caller's timezone). Over the limit: 429 `daily_limit_reached`.
        - At most one `queued` or `running` job per user, checked atomically: otherwise 409 `job_in_progress`.
        - The caller needs at least one enabled subscription: otherwise 422 `no_topics`.
        - Runner `claude_subscription` and the caller is not the configured owner: 403 `owner_only`,
          and no job is created (DESIGN 3.1).
        - A dispatch failure does not fail the request: the job stays `queued` and the next scheduler
          tick dispatches it again.
      tags: [jobs]
      responses:
        "202":
          description: Job queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`origin_mismatch` or `owner_only`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429":
          description: |
            `daily_limit_reached` (no `Retry-After`; try again the next day) or `rate_limited`.
          headers:
            Retry-After:
              description: Seconds to wait (only for `rate_limited`).
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Status of one of the caller's jobs
      description: For polling after `generateNow`. Another user's job is 404.
      tags: [jobs]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /internal/jobs/claim:
    post:
      operationId: claimJob
      summary: Worker claims the next queued job
      description: |
        Authenticated with `X-Internal-Token` only; a user JWT is rejected with 401.
        Marks the job `running` and increments `attempts`.
      tags: [internal]
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id]
              properties:
                worker_id: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: A claimed job and its request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [job, request]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  request: { $ref: "#/components/schemas/BriefRequest" }
        "204":
          description: No job is queued.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /internal/jobs/{job_id}/result:
    post:
      operationId: submitJobResult
      summary: Worker submits the generated report
      description: |
        Authenticated with `X-Internal-Token` only. In one transaction the API stores the report,
        sections, items and usage and marks the job `succeeded`.
        409 `lease_lost` if the job is not `running` or `attempt` does not match;
        422 if the body fails the BriefResult schema, or 422 `invalid_rank` if item ranks in a section
        are not exactly 1..n in array order. Sections are validated against topics owned by the job's
        user (not the user's current subscriptions), so settings edited mid-run do not reject output.
      tags: [internal]
      security:
        - internalToken: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Attempt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./brief-result.schema.json"
      responses:
        "200":
          description: Report stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [report_id]
                properties:
                  report_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /internal/jobs/{job_id}/fail:
    post:
      operationId: failJob
      summary: Worker reports a failure
      description: |
        Authenticated with `X-Internal-Token` only. If `retryable` and attempts remain, the job
        returns to `queued`; otherwise it becomes `failed`. 409 `lease_lost` if `attempt` does not match.
      tags: [internal]
      security:
        - internalToken: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Attempt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [error, retryable]
              properties:
                error: { type: string, maxLength: 2000 }
                retryable: { type: boolean }
      responses:
        "200":
          description: Resulting job state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, attempts]
                properties:
                  status: { type: string, enum: [queued, failed] }
                  attempts: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-brief_session
      description: |
        Opaque session token set by a successful sign-in or registration. `Secure; HttpOnly;
        SameSite=Strict; Path=/`. Locally (`APP_ENV=local`) the name is `brief_session_<COMPOSE_PROJECT_NAME>`
        without `Secure`. Accepted on `/v1` routes only.
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Service token for the worker. Accepted on `/internal` routes only.
  parameters:
    TopicId:
      name: topic_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Attempt:
      name: attempt
      in: query
      required: true
      description: |
        Lease fencing. The `job.attempts` value returned by `POST /internal/jobs/claim`. The API accepts
        the call only while the job is `running` with exactly this attempt number; otherwise 409 `lease_lost`
        (the lease expired and the job was re-queued or re-claimed).
      schema: { type: integer, minimum: 1 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    SessionCookie:
      description: |
        Sets the session cookie `__Host-brief_session=<token>; Secure; HttpOnly; SameSite=Strict; Path=/;
        Max-Age=<seconds until absolute_expires_at>` (host-only, no `Domain`). Clearing uses the same name
        and attributes with `Max-Age=0`. Locally (`APP_ENV=local`) the name is
        `brief_session_<COMPOSE_PROJECT_NAME>` and `Secure` is omitted.
      schema: { type: string }
    BindingCookie:
      description: |
        Sets or refreshes the browser-binding cookie `__Host-brief_ceremony=<random>; Secure; HttpOnly;
        SameSite=Strict; Path=/; Max-Age=600` (host-only, no `Domain`). An existing well-formed value is
        reused, so several ceremonies in one browser can run at once. Locally the name is
        `brief_ceremony_<COMPOSE_PROJECT_NAME>` and `Secure` is omitted.
      schema: { type: string }
  responses:
    BadRequest:
      description: Malformed request (code `bad_request`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |
        Missing, invalid, expired or revoked session, or a wrong-kind credential such as a Bearer token or
        the internal token on `/v1` (code `unauthorized`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not allowed (code `forbidden`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ForbiddenAccount:
      description: |
        Request gate on unsafe methods: `origin_mismatch` (missing, `null`, duplicate or unknown `Origin`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found or not owned by the caller (code `not_found`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        State conflict. Examples: `already_subscribed`, `job_in_progress`, `lease_lost`, `topic_exists`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: |
        Validation failed (code `validation_error`, or a specific code such as
        `slot_limit_exceeded`, `duplicate_slot`, `visibility_not_supported`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AuthBadRequest:
      description: |
        `ceremony_invalid` (unknown, expired, consumed, wrong purpose or other browser),
        `registration_failed` (attestation rejected), `enrollment_token_invalid` (unknown, revoked or
        superseded), `validation_error` or `bad_request`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AuthForbidden:
      description: "`origin_mismatch`, `account_disabled` (after a valid proof) or `admission_disabled`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AuthenticationFailed:
      description: |
        `authentication_failed` for any failed passkey proof (the body is identical for every cause), or
        `unauthorized` for a wrong-family credential (Bearer, internal token) or, on reauth, a missing,
        expired or revoked session.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TokenConflict:
      description: "`enrollment_token_used`, `enrollment_token_expired`, `credential_exists` or `passkey_limit` (add_credential token, 10 active passkeys)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PasskeyConflict:
      description: "`last_passkey`, `passkey_limit` or `credential_exists`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ReauthRequired:
      description: "`reauth_required` (no reauthentication in the last 5 minutes) or `origin_mismatch`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Body over 64 KB (code `payload_too_large`), checked before decoding.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Body is not `application/json` (code `unsupported_media_type`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited (code `rate_limited`).
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference, examples: ["about:blank"] }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code:
          type: string
          description: Machine-readable error code.
          examples: [origin_mismatch]
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    Profile:
      type: object
      additionalProperties: false
      required: [user_id, display_name, avatar_url, bio, timezone, locale, status, created_at, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string, maxLength: 80 }
        avatar_url: { type: [string, "null"], format: uri, maxLength: 2048 }
        bio: { type: string, maxLength: 500 }
        timezone: { type: string, default: Asia/Taipei, description: IANA time zone name., examples: [Asia/Taipei] }
        locale: { type: string, minLength: 2, maxLength: 35, default: zh-TW, examples: [zh-TW], description: BCP 47 language tag. }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, maxLength: 80 }
        avatar_url: { type: [string, "null"], format: uri, maxLength: 2048 }
        bio: { type: string, maxLength: 500 }
        timezone: { type: string, description: IANA time zone name. }
        locale: { type: string, minLength: 2, maxLength: 35, examples: [zh-TW], description: BCP 47 language tag. }
    RegistrationOptionsRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token]
      properties:
        enrollment_token:
          type: string
          minLength: 43
          maxLength: 128
          description: Base64url token from the enrollment link fragment. Never logged.
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[^\\u0000-\\u001f\\u007f]+$"
          description: Invite tokens only.
    CeremonyOptions:
      type: object
      additionalProperties: false
      required: [ceremony_id, public_key]
      properties:
        ceremony_id: { type: string, format: uuid }
        public_key:
          type: object
          description: |
            WebAuthn Level 3 JSON form of `PublicKeyCredentialCreationOptions` (registration, add passkey) or
            `PublicKeyCredentialRequestOptions` (login, reauth), base64url-encoded binary fields. Pass to
            `PublicKeyCredential.parseCreationOptionsFromJSON` / `parseRequestOptionsFromJSON` or an
            equivalent helper.
          additionalProperties: true
    WebAuthnCredential:
      type: object
      description: WebAuthn Level 3 JSON form of the `PublicKeyCredential` returned by the browser (`toJSON()`).
      required: [id, rawId, type, response]
      properties:
        id: { type: string, maxLength: 1400 }
        rawId: { type: string, maxLength: 1400 }
        type: { type: string, const: public-key }
        response: { type: object, additionalProperties: true }
        authenticatorAttachment: { type: [string, "null"] }
        clientExtensionResults: { type: object, additionalProperties: true }
      additionalProperties: false
    RegistrationVerifyRequest:
      type: object
      additionalProperties: false
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string, format: uuid }
        credential: { $ref: "#/components/schemas/WebAuthnCredential" }
        label: { type: string, maxLength: 64 }
    CeremonyVerifyRequest:
      type: object
      additionalProperties: false
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string, format: uuid }
        credential: { $ref: "#/components/schemas/WebAuthnCredential" }
    Passkey:
      type: object
      additionalProperties: false
      required: [id, label, created_at, last_used_at, backup_eligible, backup_state, is_current]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        backup_eligible: { type: boolean, description: Synced-capable passkey. }
        backup_state: { type: boolean, description: Currently backed up or synced. }
        is_current: { type: boolean, description: The current session was created with this passkey. }
    Session:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, is_current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        is_current: { type: boolean }
    Topic:
      type: object
      additionalProperties: false
      required: [id, title, normalized_key, visibility, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        normalized_key: { type: string, readOnly: true, description: Server-generated lookup key. }
        visibility: { type: string, enum: [private, public] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TopicCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        visibility:
          type: string
          enum: [private, public]
          default: private
          description: The POC accepts only `private`; `public` returns 422 `visibility_not_supported`.
    TopicUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        visibility:
          type: string
          enum: [private, public]
          description: The POC accepts only `private`; `public` returns 422 `visibility_not_supported`.
    Subscription:
      type: object
      additionalProperties: false
      required: [id, topic_id, topic, item_count, position, enabled]
      properties:
        id: { type: string, format: uuid }
        topic_id: { type: string, format: uuid }
        topic: { $ref: "#/components/schemas/Topic" }
        item_count: { type: integer, minimum: 1, maximum: 10, default: 3 }
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean, default: true }
    SubscriptionCreate:
      description: Either an existing `topic_id` or a new topic `title`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [topic_id]
          properties:
            topic_id: { type: string, format: uuid }
            item_count: { type: integer, minimum: 1, maximum: 10, default: 3 }
            position: { type: integer, minimum: 0 }
            enabled: { type: boolean, default: true }
        - type: object
          additionalProperties: false
          required: [title]
          properties:
            title: { type: string, minLength: 1, maxLength: 200 }
            item_count: { type: integer, minimum: 1, maximum: 10, default: 3 }
            position: { type: integer, minimum: 0 }
            enabled: { type: boolean, default: true }
    SubscriptionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        item_count: { type: integer, minimum: 1, maximum: 10 }
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean }
    DeliverySlot:
      type: object
      additionalProperties: false
      required: [id, local_time, enabled, position]
      properties:
        id: { type: string, format: uuid }
        local_time: { $ref: "#/components/schemas/LocalTime" }
        enabled: { type: boolean }
        position: { type: integer, minimum: 1, maximum: 3 }
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):(00|30)$"
      description: Local wall-clock time `HH:MM` in 30-minute steps.
      examples: ["08:00"]
    DeliverySlotsReplace:
      type: object
      additionalProperties: false
      required: [slots]
      properties:
        slots:
          type: array
          maxItems: 3
          description: Full replacement set. `local_time` values must be unique.
          items:
            type: object
            additionalProperties: false
            required: [local_time, enabled]
            properties:
              local_time: { $ref: "#/components/schemas/LocalTime" }
              enabled: { type: boolean }
    DeliverySlotSet:
      type: object
      additionalProperties: false
      required: [slots, timezone]
      properties:
        slots:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/DeliverySlot" }
        timezone: { type: string, description: IANA zone the slots are interpreted in., examples: [Asia/Taipei] }
    ReportSummary:
      type: object
      additionalProperties: false
      required: [id, report_date, slot_id, local_time, generated_at, section_count, item_count, unread_count]
      properties:
        id: { type: string, format: uuid }
        report_date: { type: string, format: date }
        slot_id: { type: [string, "null"], format: uuid }
        local_time: { oneOf: [{ $ref: "#/components/schemas/LocalTime" }, { type: "null" }] }
        generated_at: { type: string, format: date-time }
        section_count: { type: integer, minimum: 0 }
        item_count: { type: integer, minimum: 0 }
        unread_count: { type: integer, minimum: 0 }
    Report:
      type: object
      additionalProperties: false
      required: [id, report_date, slot_id, generated_at, visibility, sections]
      properties:
        id: { type: string, format: uuid }
        report_date: { type: string, format: date }
        slot_id: { type: [string, "null"], format: uuid }
        generated_at: { type: string, format: date-time }
        visibility: { type: string, enum: [private, public] }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ReportSection" }
    ReportSection:
      type: object
      additionalProperties: false
      required: [id, topic_id, title, position, status, note, items]
      properties:
        id: { type: string, format: uuid }
        topic_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        position: { type: integer, minimum: 0 }
        status: { type: string, enum: [ok, insufficient_news] }
        note: { type: [string, "null"], maxLength: 500 }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportItem" }
    ReportItem:
      type: object
      additionalProperties: false
      required: [id, rank, title, summary, source_name, source_url, published_at, mark]
      properties:
        id: { type: string, format: uuid }
        rank: { type: integer, minimum: 1 }
        title: { type: string }
        summary: { type: string }
        source_name: { type: string }
        source_url: { type: string, format: uri }
        published_at: { type: [string, "null"], format: date-time }
        mark:
          description: The caller's mark, or null if none.
          oneOf:
            - $ref: "#/components/schemas/ItemMark"
            - type: "null"
    ItemMark:
      type: object
      additionalProperties: false
      required: [item_id, read_at, note, updated_at]
      properties:
        item_id: { type: string, format: uuid }
        read_at: { type: [string, "null"], format: date-time }
        note: { type: [string, "null"], maxLength: 2000, description: Plain text. }
        updated_at: { type: string, format: date-time }
    ItemMarkUpdate:
      type: object
      additionalProperties: false
      required: [read, note]
      properties:
        read: { type: boolean }
        note: { type: [string, "null"], maxLength: 2000, description: Plain text. }
    AgentSettings:
      type: object
      additionalProperties: false
      required: [runner, model, daily_run_limit]
      properties:
        runner: { type: string, enum: [claude_subscription, anthropic_api] }
        model: { type: string, default: sonnet }
        daily_run_limit: { type: integer, minimum: 0, default: 3 }
    AgentSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All fields are reserved in the POC; any change returns 403 `agent_settings_locked`.
      properties:
        runner: { type: string, enum: [claude_subscription, anthropic_api] }
        model: { type: string }
        daily_run_limit: { type: integer, minimum: 0 }
    Job:
      type: object
      additionalProperties: false
      required: [id, user_id, slot_id, scheduled_for, attempts, runner]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        slot_id: { type: [string, "null"], format: uuid }
        scheduled_for: { type: string, format: date-time }
        attempts: { type: integer, minimum: 0 }
        runner: { type: string, enum: [claude_subscription, anthropic_api] }
    UserJob:
      type: object
      additionalProperties: false
      description: A job as its owner sees it. Never includes worker output, prompts or raw errors.
      required: [id, status, trigger, created_at, report_id, error_code]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        trigger:
          type: string
          enum: [schedule, manual]
          description: "`manual` = created by `generateNow` (`slot_id` null)."
        created_at: { type: string, format: date-time }
        report_id:
          type: [string, "null"]
          format: uuid
          description: Set when `status` is `succeeded`.
        error_code:
          type: [string, "null"]
          description: |
            Short code when `status` is `failed`, e.g. `worker_failed`, `owner_only`. Never free text.
    BriefRequest:
      type: object
      additionalProperties: false
      required: [job_id, user_id, report_date, timezone, locale, topics]
      properties:
        job_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        report_date: { type: string, format: date }
        timezone: { type: string, examples: [Asia/Taipei] }
        locale: { type: string, minLength: 2, maxLength: 35, examples: [zh-TW] }
        topics:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [topic_id, title, item_count]
            properties:
              topic_id: { type: string, format: uuid }
              title: { type: string, minLength: 1, maxLength: 200 }
              item_count: { type: integer, minimum: 1, maximum: 10 }
