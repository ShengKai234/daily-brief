# Local development conveniences, loaded automatically by `docker compose`.
# Never used for deployment.

services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./api/app:/app/app

  web:
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
