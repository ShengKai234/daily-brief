[project]
name = "daily-brief-api"
version = "0.1.0"
description = "Daily Brief API (FastAPI modular monolith)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema[format]>=4.23",
    "mangum>=0.19",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
