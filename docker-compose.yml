# Local stack (DESIGN 4.5). Project name and host ports come from .env (see AGENTS.md "Local stack").
# Production-shaped base; dev conveniences (reload, mounted source) live in docker-compose.override.yml.
#
# Services under a `todo-*` profile do not start with `make up` until their owner makes them buildable
# and removes the profile line (owner may edit only their own service block):
#   migrate -> db agent, scheduler -> api agent, web -> web agent.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs Alembic migrations (default) or seed data (`seed` argument), then exits.
  migrate:
    build: ./db
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Replaces EventBridge locally: calls the scheduler tick every SCHEDULER_INTERVAL_SECONDS.
  scheduler:
    profiles: ["todo-api"]
    build: ./api
    env_file: .env
    command: ["python", "-m", "app.scheduler_loop"]
    depends_on:
      db:
        condition: service_healthy

  # Vite dev server, proxies /api to the api service.
  web:
    profiles: ["todo-web"]
    build: ./web
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db-data:
